services:
  gemini-web2api:
    image: ${GEMINI_WEB2API_IMAGE:-ghcr.io/fancyangy/gemini-web2api:latest}
    ports:
      - "${GEMINI_WEB2API_PORT:-8081}:8081"
    volumes:
      - type: bind
        source: ./config.json
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
      - gemini-data:/data
    restart: unless-stopped

volumes:
  gemini-data:
